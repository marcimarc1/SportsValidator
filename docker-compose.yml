services:
  api:
    image: python_backend
    environment:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
    build:
      context: ./pythonBackend
      dockerfile: Dockerfile

    ports:
      - "8000:80" # Is going to forward whatever comes on the left port to the right one inside the container
    depends_on:
      - db
  db:
    image: postgres:15.2-alpine
    restart: always
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "pass"
      POSTGRES_DB: "db"
    expose:
      - 5432