services:
  api:
    image: python_backend
    build: .
    environment:
     - DATABASE_URL=postgresql://user:pass@localhost:5432/db
    ports:
      - "8080:80"
    depends_on:
      - db
#    links:
#      - db
    network_mode: host
  db:
    image: postgres:15.2-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=db
      - POSTGRES_PORT=5432
    ports:
      - "5432:5432"
    expose:
      - 5432
volumes:
  postgres_data: